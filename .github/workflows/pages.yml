name: Publicar en Pages

# Se publica desde la rama que esté avanzando. Hoy es v1; cuando se mergee,
# main sigue publicando sin tocar nada.
on:
  push:
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Las dos puertas: si alguna falla, no se publica. El typecheck va
      # primero porque Vite borra los tipos sin verificarlos — sin este paso,
      # un error de tipos llega a producción igual.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
