<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recetario</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icono-192.png">
    <meta name="theme-color" content="#17140F">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

  <body>
    <div id="app"></div>
    <!-- El velo de la escritura en curso. Hermano de #app y no hijo: pintar()
         reemplaza el contenido de #app, y algunas pantallas redibujan antes de
         escribir. El SVG es decorativo: el estado ocupado lo dice `aria-busy`
         en #app, que pone main.ts. -->
    <div id="velo-escritura" hidden>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <path class="libro" d="M14,30 L48,22 L82,30 L82,74 L48,66 L14,74 Z"/>
        <line class="libro" x1="48" y1="22" x2="48" y2="66"/>
        <line class="renglon" x1="60" y1="48" x2="80" y2="48"/>
        <line class="lapiz" x1="52" y1="34" x2="60" y2="48"/>
      </svg>
    </div>
    <script type="module" src="/src/inicio.ts"></script>
  </body>
</html>
