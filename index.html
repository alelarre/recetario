<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recetario</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icono-192.png">
    <meta name="theme-color" content="#17140F">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- El velo de la escritura en curso. Hermano de #app y no hijo: pintar()
         reemplaza el contenido de #app, y algunas pantallas redibujan antes de
         escribir. El SVG es decorativo: el estado ocupado lo dice `aria-busy`
         en #app, que pone main.ts. -->
    <div id="velo-escritura" hidden>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <!-- Las dos páginas: el lomo es el hueco entre las dos, no una línea. -->
        <path class="libro" d="M12,34 L46,28 L46,72 L12,68 Z"/>
        <path class="libro" d="M50,28 L84,34 L84,68 L50,72 Z"/>
        <!-- Lo ya escrito, fijo, en la página izquierda. -->
        <line class="renglon-fijo" x1="18" y1="44" x2="40" y2="44"/>
        <line class="renglon-fijo" x1="18" y1="52" x2="40" y2="52"/>
        <line class="renglon-fijo" x1="18" y1="60" x2="40" y2="60"/>
        <!-- Lo que se está escribiendo, en la derecha, con el lápiz encima. -->
        <line class="renglon" x1="56" y1="58" x2="78" y2="58"/>
        <g class="lapiz">
          <line class="punta" x1="56" y1="58" x2="61" y2="52"/>
          <line class="cuerpo" x1="61" y1="52" x2="69" y2="42"/>
        </g>
      </svg>
    </div>
    <script type="module" src="/src/inicio.ts"></script>
  </body>
</html>
