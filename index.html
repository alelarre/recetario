<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recetario</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icono-192.png">
    <meta name="theme-color" content="#17140F">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- El velo: la app está ocupada y no se puede tocar. Hermano de #app y no
         hijo: pintar() reemplaza el contenido de #app. Lo maneja velo.ts. El
         SVG es decorativo: el estado ocupado lo dice `aria-busy` en #app. Con
         la clase `exito` dibuja el cierre: la tapa baja y aparece el tilde, y
         el velo sigue tapando hasta que la pantalla de destino está pintada.
         Con la clase `progreso`, la tarjeta del texto y la barra toma el lugar
         de la olla. -->
    <div id="velo-escritura" hidden>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <!-- El vapor que sube, escalonado: tres hilos con el mismo recorrido. -->
        <g class="vapores">
          <path class="vapor1" d="M38,30 c0,-5 5,-5 5,-10"/>
          <path class="vapor2" d="M48,28 c0,-6 5,-6 5,-12"/>
          <path class="vapor3" d="M58,30 c0,-5 5,-5 5,-10"/>
        </g>
        <!-- La cuchara revuelve: el palo y la parte redonda, que va adentro. -->
        <g class="cuchara">
          <line x1="48" y1="55" x2="56" y2="34"/>
          <ellipse cx="46" cy="62" rx="7" ry="4.5" transform="rotate(-72 46 62)"/>
        </g>
        <path class="olla" d="M22,48 L74,48 L70,76 L26,76 Z"/>
        <line class="olla" x1="18" y1="48" x2="78" y2="48"/>
        <!-- La tapa: no se ve mientras se revuelve —no tendría sentido tapada—,
             y aparece ya puesta con el cierre. -->
        <g class="tapa">
          <line x1="24" y1="42" x2="72" y2="42"/>
          <line x1="48" y1="42" x2="48" y2="36"/>
        </g>
        <!-- El tilde del cierre: sólo se dibuja si la escritura salió bien. -->
        <polyline class="tilde" points="38,58 45,66 60,48"/>
      </svg>
      <!-- El reindexado y la carpeta base: lo que se está haciendo y cuánto va. -->
      <div class="velo-progreso">
        <p data-progreso-texto></p>
        <div class="barra"><i data-progreso-barra style="width:0%"></i></div>
      </div>
    </div>
    <script type="module" src="/src/inicio.ts"></script>
  </body>
</html>
