<!doctype html><html lang="es"><meta charset="utf-8">
<title>Lista de compras</title>

<div class="pagina">
<h1>13 — Lista de compras <span style="color:var(--fg-3);font-size:var(--txt-chico)">[exploración]</span></h1>
<p>Deriva del plan. <b>No se tilda nada:</b> se lee en el supermercado y no guarda estado. Los dos
bloques hacen visible que degrada con gracia, en vez de disimularlo.</p>

<div class="fila">
<figure class="caso">
<div class="tel" style="height:620px">
  <div class="enc">
    <button class="ico"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="tit">Lista de compras</span><span style="width:48px"></span>
  </div>
  <div class="cuerpo">
    <div class="ficha">
      <h2>Con cantidad</h2>
      <div class="ing"><span class="n">Aceite de oliva</span><span class="c">6 cucharadas</span></div>
      <div class="ing"><span class="n">Harina</span><span class="c">300 g · 200gr?</span></div>
      <div class="ing"><span class="n">Huevos</span><span class="c">3 unidades</span></div>
      <div class="ing"><span class="n">Leche</span><span class="c">300 cc</span></div>
      <div class="ing"><span class="n">Merluza</span><span class="c">1 kg</span></div>
      <div class="ing"><span class="n">Provenzal</span><span class="c">1 cucharada (opcional)</span></div>
      <div class="ing"><span class="n">Zanahorias</span><span class="c">4 medianas</span></div>
    </div>
    <div class="ficha">
      <h2>Sin cantidad</h2>
      <div class="ing"><span class="n">500gr de anillos de calamar</span></div>
      <div class="ing"><span class="n">2 huevos</span></div>
      <div class="ing"><span class="n">Leche 250gr (aprox)</span></div>
      <div class="ing"><span class="n">Sal, pimienta</span></div>
      <div class="ing"><span class="n">Sal y pimienta — a gusto</span></div>
    </div>
  </div>
</div>
<figcaption><b>Contenido real, con sus imperfecciones a la vista.</b> <i>«Harina»</i> aparece en dos
recetas con unidades distintas y <b>no se convierte</b>: se listan las dos separadas por un punto
medio. Y como el recetario original escribe sin separador, <i>«2 huevos»</i> y
<i>«Leche 250gr (aprox)»</i> caen al bloque de abajo aunque <i>«Huevos»</i> y <i>«Leche»</i> ya estén
arriba. <b>Es un hallazgo, no un error del mockup:</b> con dos convenciones conviviendo, el mismo
ingrediente puede aparecer en los dos bloques.</figcaption>
</figure>
</div>
</div>
