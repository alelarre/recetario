<figcaption><b>Tarjeta de 80 px, placeholder de 56.</b> <i>[elegida en el Hito 11]</i>, contra una variante compacta
de 40 px que sacaba la categoría de cada fila. El total del encabezado dice 20
desde el primer momento aunque la lista cargue por tramos: el spinner del final es el tramo
siguiente. <b>El título de 86 caracteres se corta en dos renglones</b> y la tarjeta crece; es el
caso que rompe la altura fija.
<br><br><b>Hallazgo:</b> dentro de una categoría las veinte fotos son <b>la misma</b>, porque el
placeholder muestra la de la categoría. No informa nada acá —la categoría ya está en el encabezado—
y compite con el título. Se conserva igual: su función es que la fila no se desalinee el día que una
receta sí tenga foto propia, y ese día conviven las dos. Queda anotado.</figcaption>
